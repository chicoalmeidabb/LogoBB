<div class="credit" aria-hidden="true">ChicoAlmeida</div>
<div class="modal" id="installModal" hidden role="dialog" aria-modal="true" aria-labelledby="imTitle">
  <div class="sheet">
    <h2 id="imTitle">Instalar en tu móvil</h2>
    <ol id="imSteps"></ol>
    <p class="note" id="imNote"></p>
    <button id="imClose" type="button" class="primary">Entendido</button>
  </div>
</div>
<div class="app">
  <header>
    <h1>Baloncesto Badajoz <span class="ver" id="ver"></span></h1>
    <p id="subtitle"></p>
    <button id="bAcad" class="hb" type="button" hidden>Academia</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="c" tabindex="0" aria-label="Logo 3D de Baloncesto Badajoz. Arrástralo para girarlo."></canvas>
    <div class="hud" id="hud" hidden>
      <span id="hScore">Puntos 0 · 0/0</span>
      <span class="hint" id="hHint">Arrastra hacia abajo y suelta para lanzar</span>
    </div>
    <div class="cscore" id="cScore" hidden></div>
    <div class="toast" id="toast" aria-live="polite"><span id="tMain">¡Canasta!</span><small id="tWho"></small></div>
    <button class="inst" id="bInst" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Instalar
    </button>
    <button class="fs" id="bFull" type="button" aria-label="Pantalla completa" title="Pantalla completa" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <div class="loading" id="loading">Cargando logo…</div>
  </div>
  <div class="player" id="player" hidden><div class="pcard">
    <h3>Tu jugador</h3>
    <div class="seg" role="group" aria-label="Jugador o jugadora">
      <button id="bBoy" type="button" aria-pressed="true">Jugador</button>
      <button id="bGirl" type="button" aria-pressed="false">Jugadora</button>
    </div>
    <div class="seg" role="group" aria-label="Mano de tiro">
      <button id="bRight" type="button" aria-pressed="true">Diestro</button>
      <button id="bLeft" type="button" aria-pressed="false">Zurdo</button>
    </div>
    <div class="seg" role="group" aria-label="Equipación">
      <button id="bKitA" type="button" aria-pressed="true">Azul</button>
      <button id="bKitN" type="button" aria-pressed="false">Negra</button>
    </div>
    <i class="br"></i>
    <input id="iNum" type="text" inputmode="numeric" maxlength="2" placeholder="Dorsal" autocomplete="off" aria-label="Tu dorsal">
    <input id="iName" type="text" maxlength="14" placeholder="Tu nombre" autocomplete="off" aria-label="Tu nombre">
    <input id="iTeam" type="text" maxlength="24" placeholder="Tu equipo o club" autocomplete="off" aria-label="Tu equipo o club">
    <button id="bDef" type="button" aria-pressed="false" title="Uno contra uno: con defensor" hidden>1x1</button>
    <button id="bPlay" type="button" class="primary" style="flex-basis:100%">Empezar</button>
  </div></div>
  <div class="player" id="menu" hidden><div class="pcard">
    <h3 id="menuT">¿Qué quieres hacer?</h3>
    <div id="menuB" style="display:flex;flex-direction:column;gap:8px;flex-basis:100%"></div>
  </div></div>
  <div class="controls">
    <button id="bSpin" type="button" aria-pressed="true" hidden>Giro continuo</button>
    <button id="bShoot" type="button" aria-pressed="true" hidden>Tirar</button>
    <button id="bMenu" type="button" hidden>Menú</button>
    <button id="bMe" type="button" hidden>Mi jugador</button>
    <button id="bDefO" type="button" hidden>Defensa</button>
    <button id="bMove" type="button" aria-pressed="false" hidden>Mover jugador</button>
    <button id="bField" type="button" aria-pressed="false" hidden>Mover campo</button>
    <div id="tapHint" style="position:fixed;left:0;right:0;top:74%;text-align:center;font:700 clamp(16px,2.4vw,22px) var(--font-ui);letter-spacing:.04em;color:var(--accent);pointer-events:none;z-index:5">Toca el escudo</div>
    <button id="bMode" type="button" class="primary" hidden>Convertir en canasta</button>
    <button id="bReset" type="button" hidden>Reiniciar</button>
  </div>
</div>

\xF1a el ranking del mes y de la temporada.","En el campeonato tambi\xE9n puedes elegir \xABCancha completa\xBB (solo cambia la vista)."]],["4. T\xE9cnica individual",["Paso 0: la regla de los pasos y con qu\xE9 pie se recoge el bal\xF3n.","Pases: de pecho, picado y sobre la cabeza. Puedes verlos en demostraci\xF3n o con \xABHazlo t\xFA\xBB.","Tambi\xE9n hay pivotes y entradas a canasta.","Mano a mano y Reverso: eliges lo que hace cada jugador, los colocas con el dedo y pulsas \xABEmpezar\xBB.","El bot\xF3n \xABC\xE1mara lenta\xBB ayuda a ver cada apoyo."]],["5. T\xE1ctica 3x3 y 5x5: colocar y hacer acciones",["Elige 1x1, 2x2, 3x3 o 5x5.","Arrastra a cada jugador con el dedo y su\xE9ltalo donde quieras. Elige si hay defensores o no, y qui\xE9n tiene el bal\xF3n.","Elige una acci\xF3n. Cada acci\xF3n se hace al momento:","\u2022 \xABVa a otra posici\xF3n\u2026\xBB: el jugador se desplaza a donde marques.","\u2022 \xABCorta hacia canasta\u2026\xBB: corre hacia la canasta que se ataca.","\u2022 \xABPasa a un compa\xF1ero\u2026\xBB: tocas al que pasa y al que recibe.","\u2022 \xABMano a mano\u2026\xBB: eliges qui\xE9n da el bal\xF3n y qui\xE9n lo recibe.","\u2022 \xABBloquea a un compa\xF1ero\u2026\xBB: tocas al que bloquea y al bloqueado, eliges el lado y a d\xF3nde va el bloqueado.","\u2022 \xABSe abre fuera del triple\u2026\xBB, \xABBota\xBB, \xABTira a canasta\xBB y \xABEntra a canasta\xBB.","Despu\xE9s de cada acci\xF3n, elige la siguiente: las posiciones y el bal\xF3n se quedan como han acabado."]],["6. Dibujar una flecha, paso a paso",["Pulsa \xABVa a otra posici\xF3n\u2026\xBB (o \xABCorta hacia canasta\u2026\xBB).","Pon el dedo sobre el jugador, en el propio mu\xF1eco. No empieces en el suelo.","Sin soltar el dedo, arrastra hasta donde quieres que acabe y suelta.","El jugador se desplaza siguiendo la l\xEDnea hasta el final.","La l\xEDnea sigue visible mientras \xE9l se mueve.","Si no te deja dibujar: mira que \xABMover campo\xBB NO est\xE9 pulsado, y que no est\xE9 en marcha otra acci\xF3n (espera a que termine).","Si te equivocas, pulsa \xAB\u21B6 Deshacer\xBB y dib\xFAjala otra vez."]],["7. Cancha completa (5x5)",["Pulsa \xABCancha completa\xBB para jugar de una canasta a otra, con el pabell\xF3n y el p\xFAblico.","El equipo ataca siempre una canasta. Las flechas azules del suelo te dicen cu\xE1l. Si el bal\xF3n empieza cerca de un fondo (sacando de fondo), ataca la canasta contraria.","Si no es la que quieres, pulsa \xAB\u21C4 Cambiar sentido del ataque\xBB. Solo se puede antes del primer paso.","\xABCorta hacia canasta\xBB, \xABTira\xBB y \xABEntra\xBB van siempre a esa canasta. Antes iban a la m\xE1s cercana y por eso el jugador se iba a la de atr\xE1s.","Las posiciones fijas no se ense\xF1an: los jugadores los colocas t\xFA."]],["8. Ejemplo completo",["Ejemplo en cancha completa:","1) Pulsa \xABBloquea a un compa\xF1ero\u2026\xBB. Toca al 2, luego al 3, elige el lado y marca a d\xF3nde va el 3.","2) Pulsa \xABVa a otra posici\xF3n\u2026\xBB. Pon el dedo en el 2 y dibuja la l\xEDnea hasta la mitad de la zona.","3) Pulsa \xABPasa a un compa\xF1ero\u2026\xBB. Toca al 1 y luego al 2 o al 3.","4) Elige qu\xE9 hace el 1 despu\xE9s de pasar, y as\xED sigues.","En cualquier momento pulsa \xAB\u25B6 Ver lo hecho\xBB para ver todo desde el principio."]],["9. Ver lo hecho, Deshacer e Inicio",["\xAB\u25B6 Ver lo hecho\xBB: repite todos los pasos desde el principio sin terminar la jugada. Est\xE1 gris hasta que haya alg\xFAn paso. Al acabar sigues por donde ibas.","\xAB\u21B6 Deshacer\xBB: quita el \xFAltimo paso.","\xABInicio\xBB: vuelve a la posici\xF3n del principio. Sirve tambi\xE9n para recolocar jugadores o cambiar el sentido del ataque.","\xABRepetir la jugada entera\xBB: la vuelve a hacer de cero.","\xABEmpezar de cero\xBB: borra todo y pone la salida normal (pide confirmaci\xF3n)."]],["10. Flechas (varios jugadores a la vez)",["Solo en cancha completa. Pulsa \xABFlechas\xBB (arriba, junto a \xABColocar\xBB).","Dibuja una flecha desde cada jugador que quieras mover.","Pulsa \xABJugar flechas\xBB y se mueven todos a la vez.","Pulsa una flecha para seleccionarla y borrarla con \xABBorrar esta flecha\xBB. Si no, \xABBorrar flechas\xBB las quita todas.","Pulsa \xABColocar\xBB para volver a las acciones normales."]],["11. Guardar jugadas",["Haz alguna acci\xF3n, escribe un nombre y pulsa \xABGuardar jugada\xBB.","Se guarda solo en esa tablet y en ese navegador. Si borras los datos del navegador o desinstalas la app, se pierde.","En otra tablet o en el m\xF3vil no aparecen.","M\xE1s adelante se guardar\xE1n en la nube del club."]],["12. Ejercicios y entrenadores",["Solo para entrenadores. Entras desde el escudo de la app del club, con tu nombre.","Arrastra los conos a la pista, toca un cono para poner una fila de jugadores con sus balones y elige qu\xE9 hace cada uno.","Hay ejercicios ya hechos, como pasar y cortar, y puedes guardar los tuyos."]],["13. C\xE1mara lenta y problemas t\xEDpicos",["El bot\xF3n \xABC\xE1mara lenta\xBB est\xE1 en casi todas las pantallas.","\xABNo me deja dibujar\xBB: mira que \xABMover campo\xBB no est\xE9 pulsado y espera a que termine la acci\xF3n en marcha.","\xABEl jugador se va a la canasta de atr\xE1s\xBB: mira las flechas azules del suelo y pulsa \xAB\u21C4 Cambiar sentido del ataque\xBB (antes del primer paso).","\xABEl bot\xF3n Ver lo hecho est\xE1 gris\xBB: a\xFAn no has hecho ning\xFAn paso.","\xABHe perdido mis jugadas\xBB: se guardaban en el navegador y se han borrado.","\xABEl juego no se actualiza\xBB: ci\xE9rralo del todo y \xE1brelo otra vez. Arriba debe verse la versi\xF3n nueva."]]],a=document.createElement("div");a.style.cssText="max-height:56vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;text-align:left;padding-right:4px",e.forEach(function(r){var s=document.createElement("details");s.style.cssText="font-size:.92rem;line-height:1.45;border:1px solid rgba(27,111,138,.28);border-radius:12px;padding:8px 12px;background:rgba(25
