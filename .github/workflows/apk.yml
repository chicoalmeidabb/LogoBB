name: Crear APK del juego

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Número de versión del APK (por ejemplo 1)'
        default: '2'
      url:
        description: 'Dirección de la página que abre la app'
        default: 'https://chicoalmeidabb.github.io/LogoBB/'
      nombre:
        description: 'Nombre que sale bajo el icono'
        default: 'Baloncesto Badajoz 3D'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Crear el proyecto de Android
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.nombre }}
          APP_VER: ${{ inputs.version }}
        run: |
          mkdir -p app/src/main/java/club/bb/app app/src/main/res/mipmap-xxxhdpi app/src/main/res/values
          cat > settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BBApp"
          include ':app'
          EOT
          cat > build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOT
          cat > app/build.gradle <<EOT
          plugins { id 'com.android.application' }
          android {
              namespace 'club.bb.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'club.bb.app'
                  minSdk 24
                  targetSdk 34
                  versionCode ${APP_VER}
                  versionName '${APP_VER}'
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOT
          sed -i 's/^          //' settings.gradle build.gradle app/build.gradle
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:allowBackup="true" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT
          sed -i 's/^          //' app/src/main/AndroidManifest.xml
          printf '<resources><string name="app_name">%s</string></resources>\n' "$APP_NAME" > app/src/main/res/values/strings.xml
          cat > app/src/main/java/club/bb/app/MainActivity.java <<EOT
          package club.bb.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> chooser;
              private static final String START = "${APP_URL}";
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  if (android.os.Build.VERSION.SDK_INT >= 29) { s.setForceDark(WebSettings.FORCE_DARK_OFF); }
                  web.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView v, String u) { v.evaluateJavascript("(function(){var s=document.createElement('style');s.textContent='#bInst{display:none!important}';document.head.appendChild(s);})()", null); }
                      @Override public boolean shouldOverrideUrlLoading(WebView v, android.webkit.WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          if (u.startsWith("http://") || u.startsWith("https://")) { return false; }
                          try { startActivity(new Intent(Intent.ACTION_VIEW, r.getUrl())); } catch (Exception e) { }
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (chooser != null) { chooser.onReceiveValue(null); }
                          chooser = cb;
                          try { startActivityForResult(p.createIntent(), 7); } catch (Exception e) { chooser = null; return false; }
                          return true;
                      }
                  });
                  if (b != null) { web.restoreState(b); } else { web.loadUrl(START); }
              }
              @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }
              @Override protected void onActivityResult(int rq, int rs, Intent d) {
                  if (rq == 7 && chooser != null) { chooser.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(rs, d)); chooser = null; }
                  else { super.onActivityResult(rq, rs, d); }
              }
              @Override public void onWindowFocusChanged(boolean f) {
                  super.onWindowFocusChanged(f);
                  if (f) { getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY); }
              }
              @Override public void onBackPressed() { if (web.canGoBack()) { web.goBack(); } else { super.onBackPressed(); } }
          }
          EOT
          sed -i 's/^          //' app/src/main/java/club/bb/app/MainActivity.java
          BASE="${APP_URL%/}"
          curl -fsSL "$BASE/icon-512.png" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || curl -fsSL "$BASE/icon-192.png" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Fabricar el APK
        run: gradle --no-daemon assembleDebug
      - name: Publicar el APK para descargarlo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BaloncestoBadajoz3D.apk
          gh release create "apk-v${{ inputs.version }}-${{ github.run_number }}" BaloncestoBadajoz3D.apk --repo "${{ github.repository }}" --title "APK v${{ inputs.version }}" --notes "Archivo para instalar en Android."
